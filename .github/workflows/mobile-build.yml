name: 📱 Luxus-Brecho Mobile CI/CD

on:
  push:
    branches: [main, dev, mobile]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        description: 'Tipo de build'
        options:
          - preview
          - production
        default: 'preview'
        
permissions:
  contents: write
  packages: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

# Cancela builds obsoletos do mesmo ref quando chega um novo push,
# evitando consumir cota do EAS com builds que serão descartados.
concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v5

      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: 📦 Instalar dependências
        run: |
          cd mobile
          npm install

      - name: 🔧 Instalar EAS CLI globalmente
        run: |
          npm install -g eas-cli
          eas --version

      - name: 🔐 Verificar autenticação Expo
        run: |
          echo "Verificando token Expo..."
          if [ -z "$EXPO_TOKEN" ]; then
            echo "❌ ERRO: EXPO_TOKEN não configurado!"
            exit 1
          fi
          echo "✅ EXPO_TOKEN configurado"
          eas whoami

      - name: 🔍 Debug configuração
        run: |
          echo "📋 Informações do build:"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Autor: ${{ github.actor }}"
          cd mobile
          echo "Versão do app:"
          node -p "require('./app.json').expo.version"

      - name: 🏗️ Build APK
        id: build
        run: |
          cd mobile
          BUILD_TYPE="${{ github.event.inputs.build_type || 'preview' }}"
          echo "📱 Iniciando build EAS (cloud) com profile: $BUILD_TYPE"

          # Build na nuvem do Expo (sem --local): o keystore de assinatura
          # permanece nos servidores do Expo e nunca é baixado para o runner,
          # evitando o vazamento das credenciais nos logs em caso de falha.
          eas build --platform android --profile "$BUILD_TYPE" \
            --non-interactive --wait --json > "$RUNNER_TEMP/build.json"

          APK_URL=$(jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl // empty' "$RUNNER_TEMP/build.json")
          if [ -z "$APK_URL" ]; then
            echo "❌ Não foi possível obter a URL do artifact do build:"
            cat "$RUNNER_TEMP/build.json"
            exit 1
          fi

          echo "⬇️  Baixando APK gerado na nuvem..."
          curl -fSL -o ../app.apk "$APK_URL"
          echo "build_status=success" >> $GITHUB_OUTPUT
          echo "✅ Build concluído e APK baixado!"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📝 Obter informações da versão
        id: version
        if: always()
        run: |
          cd mobile
          VERSION=$(node -p "require('./app.json').expo.version")
          BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: 📦 Upload APK como artifact
        uses: actions/upload-artifact@v6
        if: steps.build.outputs.build_status == 'success'
        with:
          name: luxus-brecho-v${{ steps.version.outputs.version }}-build-${{ github.run_number }}
          path: app.apk
          retention-days: 30

      - name: 🚀 Criar GitHub Release
        uses: softprops/action-gh-release@v3
        if: steps.build.outputs.build_status == 'success'
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: 🛍️ Luxus-Brecho v${{ steps.version.outputs.version }} Build #${{ github.run_number }}
          draft: false
          prerelease: false
          files: app.apk
          body: |
            ## 🛍️ Luxus-Brecho Mobile App
            
            **📦 Versão:** ${{ steps.version.outputs.version }}
            **🔢 Build:** #${{ github.run_number }}
            **📅 Data:** ${{ steps.version.outputs.build_date }}
            **🌿 Branch:** ${{ github.ref_name }}
            **👤 Autor:** ${{ github.actor }}
            
            ---
            
            ### 📝 Alterações:
            ${{ github.event.head_commit.message }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📧 Enviar email - Sucesso
        uses: dawidd6/action-send-mail@v9
        if: steps.build.outputs.build_status == 'success'
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ Build #${{ github.run_number }} - Luxus-Brecho"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_FROM }}
          html_body: |
            <h2>🛍️ Build Concluído!</h2>
            <p><strong>Versão:</strong> ${{ steps.version.outputs.version }}</p>
            <p><strong>Build:</strong> #${{ github.run_number }}</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}-${{ github.run_number }}">📥 Download APK</a></p>

      - name: 📧 Enviar email - Falha
        uses: dawidd6/action-send-mail@v9
        if: steps.build.outputs.build_status == 'failure'
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ Build #${{ github.run_number }} Falhou"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_FROM }}
          html_body: |
            <h2>❌ Build Falhou</h2>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Ver Logs</a></p>

      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -f app.apk 2>/dev/null || true
